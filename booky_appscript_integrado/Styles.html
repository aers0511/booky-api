<style>
  :root {
    --brand: #07558a;
    --brand-dark: #063d63;
    --brand-soft: #eaf3f8;
    --accent: #d7a928;
    --ink: #243444;
    --muted: #657586;
    --line: #dce4eb;
    --surface: #ffffff;
    --page: #f5f7f9;
    --success: #176b4b;
    --success-bg: #eaf5ef;
    --warning: #795b13;
    --warning-bg: #fff7e4;
    --danger: #a33b32;
    --danger-bg: #fff0ee;
    --radius: 12px;
    --shadow: 0 5px 18px rgba(24, 48, 69, .055);
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.55 Inter, "Segoe UI", Arial, sans-serif;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .salto-contenido {
    position: absolute;
    left: 12px;
    top: -100px;
    z-index: 20;
    padding: 10px 14px;
    background: #fff;
    color: var(--brand-dark);
    border-radius: 8px;
  }

  .salto-contenido:focus {
    top: 12px;
  }

  .encabezado {
    color: #fff;
    background: linear-gradient(115deg, #06436d 0%, #08669a 100%);
    border-bottom: 3px solid var(--accent);
    padding: 30px 24px 32px;
  }

  .encabezado-contenido {
    width: min(1080px, 100%);
    margin: 0 auto;
  }

  .marca-institucional {
    margin-bottom: 9px;
    color: #d8e9f4;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
  }

  .encabezado h1 {
    margin: 0;
    font-size: clamp(24px, 3vw, 31px);
    line-height: 1.2;
    letter-spacing: -.45px;
    font-weight: 700;
  }

  .encabezado p {
    margin: 9px 0 0;
    max-width: 680px;
    color: #e4eff6;
    font-size: 15px;
  }

  .contenedor {
    width: min(1040px, calc(100% - 40px));
    margin: 28px auto 48px;
  }

  .introduccion-formulario {
    margin: 0 0 20px;
    padding: 25px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .etiqueta-superior {
    display: block;
    margin-bottom: 7px;
    color: var(--brand);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .introduccion-formulario h2 {
    margin: 0 0 7px;
    color: #1e3447;
    font-size: 22px;
    line-height: 1.3;
  }

  .introduccion-formulario p {
    margin: 0;
    color: var(--muted);
  }

  .pasos-resumen {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    margin: 20px 0 0;
    padding: 0;
    list-style: none;
  }

  .pasos-resumen li {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #435568;
    font-size: 13px;
    font-weight: 650;
  }

  .pasos-resumen li span,
  .numero-seccion {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    border-radius: 50%;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 12px;
    font-weight: 800;
  }

  .tarjeta {
    margin: 0 0 18px;
    padding: 25px 27px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .tarjeta h2 {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0 0 9px;
    padding: 0;
    border: 0;
    color: #24394b;
    font-size: 19px;
    line-height: 1.35;
  }

  .tarjeta h3 {
    margin: 24px 0 13px;
    padding-bottom: 9px;
    border-bottom: 1px solid #edf1f4;
    color: #30495e;
    font-size: 15px;
  }

  .numero-seccion {
    flex: 0 0 29px;
    width: 29px;
    height: 29px;
    border-radius: 8px;
  }

  .ayuda-seccion {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .texto-ayuda,
  .nota-captura {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
  }

  .rejilla {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 17px 20px;
    align-items: start;
  }

  .campo {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-width: 0;
  }

  .campo label,
  .cantidad label {
    color: #35495c;
    font-size: 13px;
    font-weight: 700;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-width: 0;
    min-height: 45px;
    padding: 10px 13px;
    border: 1px solid #cbd6df;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    transition: border-color .16s, box-shadow .16s;
  }

  input::placeholder,
  textarea::placeholder {
    color: #8997a4;
    opacity: 1;
  }

  input:hover,
  select:hover,
  textarea:hover {
    border-color: #9eafbd;
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: 0;
    border-color: #2878a8;
    box-shadow: 0 0 0 3px rgba(40, 120, 168, .13);
  }

  input[readonly] {
    background: #f3f6f8;
    color: #526477;
  }

  textarea {
    min-height: 94px;
    resize: vertical;
  }

  .busqueda-profesor {
    grid-column: 1/-1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 4px;
    padding: 17px;
    border: 1px solid #dce7ee;
    border-radius: 10px;
    background: #f7fafc;
  }

  .busqueda-profesor>div {
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .busqueda-profesor input {
    flex: 1;
  }

  .estado-busqueda {
    display: none;
    margin: 0;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  .estado-busqueda.visible {
    display: block;
    background: var(--warning-bg);
    border-color: #f0dfad;
    color: var(--warning);
  }

  .estado-busqueda.estado-exito {
    background: var(--success-bg);
    border-color: #cce5d7;
    color: var(--success);
  }

  .estado-busqueda.estado-error {
    background: var(--danger-bg);
    border-color: #f0d0cc;
    color: var(--danger);
  }

  .estado-busqueda.estado-cargando {
    background: var(--brand-soft);
    border-color: #d3e3ed;
    color: var(--brand-dark);
  }

  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    padding: 10px 17px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: var(--brand);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: background .16s, border-color .16s, transform .16s;
  }

  .boton:hover {
    background: var(--brand-dark);
  }

  .boton:active {
    transform: translateY(1px);
  }

  .boton:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .boton-secundario {
    background: #fff;
    border-color: #cbd9e3;
    color: var(--brand);
  }

  .boton-secundario:hover {
    background: #f0f6fa;
    border-color: #9db8ca;
    color: var(--brand-dark);
  }

  .boton-amarillo {
    background: #e4b943;
    color: #273442;
    border-color: #d7aa35;
  }

  .boton-amarillo:hover {
    background: #d9aa31;
    color: #1f2c38;
  }

  .acciones {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }

  .acciones-validacion {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-top: 18px;
    padding: 17px;
    background: #f7fafc;
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .acciones-validacion-info {
    min-width: 0;
  }

  .acciones-validacion-info strong {
    display: block;
    color: #30495e;
    font-size: 14px;
  }

  .acciones-validacion-info .texto-ayuda {
    margin: 4px 0 0;
  }

  .libro {
    margin: 15px 0;
    padding: 20px;
    border: 1px solid #d8e2e9;
    border-radius: 10px;
    background: #fff;
  }

  .libro-encabezado {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 17px;
    padding-bottom: 12px;
    border-bottom: 1px solid #edf1f4;
  }

  .libro-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
    padding: 3px 0;
    border: 0;
    background: transparent;
    color: var(--brand-dark);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .libro-toggle-icono {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    border-radius: 7px;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 17px;
    font-weight: 700;
  }

  .libro-titulo {
    font-size: 15px;
    font-weight: 750;
  }

  .libro-resumen {
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .libro-quitar {
    flex: 0 0 auto;
  }

  .libro-contenido {
    display: block;
  }

  .libro-contraido .libro-encabezado {
    margin-bottom: 0;
    padding-bottom: 0;
    border: 0;
  }

  .libro-contraido .libro-contenido {
    display: none;
  }

  .libro .rejilla {
    gap: 15px 18px;
  }

  .libro .campo[style*="grid-column"] {
    grid-column: 1/-1;
  }

  .cantidades,
  .cantidades-campus {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .cantidad {
    padding: 13px;
    border: 1px solid #e0e7ed;
    border-radius: 9px;
    background: #f8fafb;
    text-align: left;
  }

  .cantidad label {
    display: block;
    margin-bottom: 7px;
  }

  .cantidad small {
    display: block;
    margin: 7px 0 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .cantidad input {
    min-height: 40px;
    text-align: center;
    font-weight: 650;
    background: #fff;
  }

  .libro>.texto-ayuda {
    margin: 12px 0 0;
  }

  .tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 9px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
  }

  th,
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
  }

  th {
    background: #f0f5f8;
    color: #344c60;
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
  }

  td {
    font-size: 13px;
  }

  .mensaje {
    display: none;
    margin: 14px 0;
    padding: 13px 15px;
    border: 1px solid transparent;
    border-radius: 9px;
    font-size: 14px;
  }

  .mensaje.exito {
    display: block;
    background: var(--success-bg);
    border-color: #cce5d7;
    color: var(--success);
  }

  .mensaje.error {
    display: block;
    background: var(--danger-bg);
    border-color: #f0d0cc;
    color: var(--danger);
  }

  .mensaje.advertencia {
    display: block;
    background: var(--warning-bg);
    border-color: #f0dfad;
    color: var(--warning);
  }

  .mensaje.estado-cargando {
    display: block;
    background: var(--brand-soft);
    border-color: #d3e3ed;
    color: var(--brand-dark);
  }

  .insignia {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    background: var(--brand-soft);
    color: var(--brand);
    font-size: 12px;
    font-weight: 700;
  }

  .resultado-libro {
    margin: 10px 0;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fff;
  }

  .resultado-libro>p {
    margin: 7px 0;
  }

  .resultado-autollenado,
  .resultado-advertencia {
    margin: 10px 0 0;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  .resultado-autollenado {
    background: var(--success-bg);
    border: 1px solid #cce5d7;
    color: var(--success);
  }

  .resultado-advertencia {
    background: var(--warning-bg);
    border: 1px solid #f0dfad;
    color: var(--warning);
  }

  .selector-coincidencia {
    display: block;
    width: 100%;
    min-height: 44px;
    margin: 10px 0;
    padding: 9px 12px;
    border: 1px solid #cbd6df;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }

  .detalle-coincidencia {
    margin: 8px 0;
    padding: 12px;
    border-radius: 8px;
    background: #f4f7f9;
    overflow-wrap: anywhere;
  }

  #confirmacion {
    padding: 34px 25px;
    text-align: center;
  }

  #folioGenerado {
    display: inline-block;
    margin: 10px 0;
    padding: 12px 22px;
    border: 1px solid #dce6ed;
    border-radius: 9px;
    background: #f2f7fa;
    color: var(--brand-dark);
    font-size: 24px;
    letter-spacing: 1px;
  }

  .pie {
    padding: 22px 15px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }

  .oculto {
    display: none !important;
  }

  button:focus-visible,
  a:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible {
    outline: 3px solid #d7a928;
    outline-offset: 2px;
  }

  @media (max-width:760px) {
    .contenedor {
      width: calc(100% - 28px);
      margin: 20px auto 34px;
    }

    .encabezado {
      padding: 25px 18px 27px;
    }

    .tarjeta {
      padding: 21px 19px;
    }

    .rejilla {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .campo[style*="grid-column"] {
      grid-column: 1/-1 !important;
    }

    .pasos-resumen {
      display: grid;
      gap: 10px;
    }

    .acciones-validacion {
      align-items: stretch;
      flex-direction: column;
    }

    .acciones-validacion .boton {
      width: 100%;
      white-space: normal;
    }
  }

  @media (max-width:560px) {
    body {
      font-size: 14px;
    }

    .contenedor {
      width: calc(100% - 20px);
      margin: 14px auto 26px;
    }

    .encabezado {
      padding: 22px 16px 24px;
    }

    .encabezado h1 {
      font-size: 24px;
    }

    .encabezado p {
      font-size: 14px;
    }

    .introduccion-formulario {
      padding: 20px 17px;
    }

    .introduccion-formulario h2 {
      font-size: 20px;
    }

    .tarjeta {
      padding: 19px 15px;
    }

    .tarjeta h2 {
      font-size: 17px;
    }

    .busqueda-profesor>div {
      flex-direction: column;
    }

    .busqueda-profesor .boton,
    .acciones .boton {
      width: 100%;
    }

    .acciones {
      align-items: stretch;
      flex-direction: column;
    }

    .libro {
      padding: 15px 12px;
    }

    .libro-encabezado {
      gap: 8px;
    }

    .libro-resumen {
      max-width: 120px;
    }

    .libro-encabezado .boton {
      width: auto;
    }

    .cantidades,
    .cantidades-campus {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    th,
    td {
      padding: 10px;
    }

    #folioGenerado {
      font-size: 20px;
    }
  }

  @media (prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }
</style>
